<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="WaffleMatrix — A lightweight, fast PDF viewer built with Rust and Tauri" />
    <title>WaffleMatrix PDF Viewer</title>

    <!-- Prevent FOUC: apply persisted theme before first paint -->
    <script>
      (function () {
        var cs = localStorage.getItem('wafflematrix-color-scheme');
        if (cs === 'light' || cs === 'dark') {
          document.documentElement.classList.add('theme-' + cs);
          document.querySelector('meta[name="color-scheme"]').content = cs;
        }
      })();
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/index.css" />
    <link rel="stylesheet" href="./styles/toolbar.css" />
    <link rel="stylesheet" href="./styles/sidebar.css" />
    <link rel="stylesheet" href="./styles/viewer.css" />
  </head>

  <body>
    <!-- ===== ROOT WRAPPER ===== -->
    <div class="app">

      <!-- ===== TOOLBAR ===== -->
      <header class="toolbar" role="banner">

        <!-- Left group: Sidebar toggle + Open -->
        <div class="toolbar__left">
          <button
            id="btn-sidebar"
            class="toolbar-btn"
            aria-label="Toggle sidebar"
            data-i18n-aria="toolbar.sidebar"
            title="Sidebar (Ctrl+B)"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>

          <button
            id="btn-open"
            class="toolbar-btn toolbar-btn--text"
            aria-label="Open PDF"
            title="Open (Ctrl+O)"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span data-i18n="toolbar.open">Open</span>
          </button>
        </div>

        <!-- Center: Navigation controls -->
        <div class="toolbar__center">
          <button
            id="btn-prev"
            class="toolbar-btn"
            aria-label="Previous page"
            data-i18n-aria="toolbar.prevPage"
            title="Previous page (←)"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>

          <div class="toolbar__page-nav">
            <input
              id="inp-page"
              class="toolbar__page-input"
              type="number"
              min="1"
              value="1"
              aria-label="Current page"
              disabled
            />
            <span class="toolbar__page-total" aria-hidden="true" data-i18n="toolbar.pageOf">of</span>
            <span id="total-pages" class="toolbar__page-total">—</span>
          </div>

          <button
            id="btn-next"
            class="toolbar-btn"
            aria-label="Next page"
            data-i18n-aria="toolbar.nextPage"
            title="Next page (→)"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>

          <div class="toolbar__divider" aria-hidden="true"></div>

          <!-- Zoom controls -->
          <div class="toolbar__zoom">
            <button
              id="btn-zoom-out"
              class="toolbar-btn"
              aria-label="Zoom out"
              data-i18n-aria="toolbar.zoomOut"
              title="Zoom out (−)"
              disabled
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                <line x1="8" y1="11" x2="14" y2="11"/>
              </svg>
            </button>

            <button
              id="btn-zoom-fit"
              class="toolbar-btn toolbar__zoom-level"
              aria-label="Zoom level / Reset zoom"
              title="Reset zoom (Ctrl+0)"
              disabled
            >
              <span id="zoom-level">100%</span>
            </button>

            <button
              id="btn-zoom-in"
              class="toolbar-btn"
              aria-label="Zoom in"
              data-i18n-aria="toolbar.zoomIn"
              title="Zoom in (+)"
              disabled
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                <line x1="11" y1="8" x2="11" y2="14"/>
                <line x1="8" y1="11" x2="14" y2="11"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Right group -->
        <div class="toolbar__right">
          <!-- Search toggle -->
          <button
            id="btn-search"
            class="toolbar-btn toolbar__search-toggle"
            aria-label="Search"
            data-i18n-aria="toolbar.search"
            title="Search (Ctrl+F)"
            disabled
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>

          <!-- Theme toggle -->
          <button
            id="btn-theme"
            class="toolbar-btn toolbar-btn--theme"
            aria-label="Toggle theme"
            data-i18n-aria="toolbar.theme"
            title="Toggle dark/light theme"
          >
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>

          <!-- Language toggle -->
          <button
            id="btn-lang"
            class="toolbar-btn toolbar-btn--lang"
            aria-label="Toggle language"
            data-i18n-aria="toolbar.lang"
            title="Switch language (EN/JA)"
          >
            <span id="lang-label">EN</span>
          </button>
        </div>
      </header>

      <!-- ===== SEARCH PANEL (below toolbar) ===== -->
      <div id="search-panel" class="search-panel" role="search" aria-label="Document search" hidden>
        <div class="search-panel__inner">
          <div class="search-panel__input-wrap">
            <svg class="search-panel__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              id="search-input"
              class="search-panel__input"
              type="search"
              placeholder="Search in document..."
              data-i18n-placeholder="search.placeholder"
              aria-label="Search"
              autocomplete="off"
            />
            <span id="search-count" class="search-panel__count" aria-live="polite"></span>
          </div>
          <div class="search-panel__nav">
            <button id="btn-search-prev" class="search-panel__btn" aria-label="Previous result" data-i18n-aria="search.prev" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
            <button id="btn-search-next" class="search-panel__btn" aria-label="Next result" data-i18n-aria="search.next" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <button id="btn-search-close" class="search-panel__btn" aria-label="Close search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <ul id="search-results" class="search-panel__results" role="list" aria-label="Search results"></ul>
      </div>

      <!-- ===== MAIN BODY ===== -->
      <div class="app__body">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Document navigation">
          <div class="sidebar__tabs" role="tablist">
            <button
              class="sidebar__tab sidebar__tab--active"
              id="tab-outline"
              role="tab"
              aria-selected="true"
              aria-controls="panel-outline"
            >
              <span data-i18n="sidebar.outline">Outline</span>
            </button>
            <button
              class="sidebar__tab"
              id="tab-thumbnails"
              role="tab"
              aria-selected="false"
              aria-controls="panel-thumbnails"
            >
              <span data-i18n="sidebar.thumbnails">Thumbnails</span>
            </button>
          </div>

          <!-- Outline panel -->
          <div id="panel-outline" class="sidebar__panel sidebar__panel--active" role="tabpanel" aria-labelledby="tab-outline">
            <div id="outline-content" class="sidebar__scroll">
              <div class="sidebar__empty">
                <p class="sidebar__empty-title" data-i18n="sidebar.noOutline">No outline available</p>
                <p class="sidebar__empty-desc" data-i18n="sidebar.noOutlineDesc">This PDF does not contain a table of contents.</p>
              </div>
            </div>
          </div>

          <!-- Thumbnails panel -->
          <div id="panel-thumbnails" class="sidebar__panel" role="tabpanel" aria-labelledby="tab-thumbnails" hidden>
            <div id="thumbnails-content" class="sidebar__scroll sidebar__thumbnails"></div>
          </div>
        </aside>

        <!-- PDF Viewer -->
        <main class="viewer" id="viewer-main" role="main" aria-label="PDF viewer">
          <!-- Welcome / empty state -->
          <div class="viewer__welcome" id="viewer-welcome">
            <div class="viewer__welcome-card">
              <!-- WaffleMatrix logo grid -->
              <div class="viewer__welcome-icon" aria-hidden="true">
                <div class="viewer__logo-grid">
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                </div>
              </div>
              <h1 class="viewer__welcome-title" data-i18n="viewer.welcome.title">WaffleMatrix PDF Viewer</h1>
              <p class="viewer__welcome-sub" data-i18n="viewer.welcome.subtitle">Open a PDF file to get started, or drag and drop one here.</p>
              <p class="viewer__welcome-hint">
                <kbd>Ctrl</kbd><span>+</span><kbd>O</kbd>
                <span class="viewer__welcome-hint-text" data-i18n="viewer.welcome.shortcut">to open</span>
              </p>

              <!-- Recent Files -->
              <div class="viewer__recent" id="recent-files-container" hidden>
                <h2 class="viewer__recent-title" data-i18n="viewer.recent">Recent Files</h2>
                <ul class="viewer__recent-list" id="recent-files-list"></ul>
              </div>
            </div>
            <!-- Drop zone overlay -->
            <div class="viewer__dropzone" id="dropzone" aria-hidden="true" hidden>
              <div class="viewer__dropzone-inner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span data-i18n="viewer.dropzone">Drop PDF file here</span>
              </div>
            </div>
          </div>

          <!-- Canvas area (shown when PDF is open) -->
          <div class="viewer__canvas-container" id="viewer-canvas-wrap" hidden>
            <div class="viewer__page">
              <canvas id="pdf-canvas" class="viewer__canvas" aria-label="PDF page"></canvas>
            </div>
            <!-- Loading indicator -->
            <div class="viewer__loading" id="viewer-loading" hidden aria-live="polite">
              <div class="viewer__spinner" aria-hidden="true"></div>
              <span data-i18n="viewer.loading">Loading...</span>
            </div>
          </div>
        </main>
      </div><!-- /.app__body -->

    </div><!-- /.app -->

    <!-- ===== STATUSBAR ===== -->
    <footer class="statusbar" role="contentinfo">
      <div class="statusbar__left">
        <span class="statusbar__dot statusbar__dot--idle" id="statusbar-dot" aria-hidden="true"></span>
        <span id="status-text" class="statusbar__text" data-i18n="status.ready">Ready</span>
      </div>
      <div class="statusbar__right">
        <span id="status-zoom" class="statusbar__zoom" aria-live="polite"></span>
      </div>
    </footer>

    <!-- Scripts (module) -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>

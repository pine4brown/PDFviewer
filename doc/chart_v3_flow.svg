<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="100%">
  <rect width="650" height="240" fill="#f8fafc" rx="12"/>
  <text x="325" y="32" font-family="Hiragino Sans, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">PDF差分解析パイプライン 処理フロー</text>
  
  <!-- Step 1 -->
  <rect x="25" y="75" width="120" height="70" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="8"/>
  <text x="85" y="105" font-family="Hiragino Sans, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Step 1</text>
  <text x="85" y="125" font-family="Hiragino Sans, sans-serif" font-size="11" fill="#475569" text-anchor="middle">PDF構文解析</text>

  <path d="M 145 110 L 175 110" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Step 2 -->
  <rect x="180" y="75" width="120" height="70" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="240" y="105" font-family="Hiragino Sans, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Step 2</text>
  <text x="240" y="125" font-family="Hiragino Sans, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">レイアウト分離</text>

  <path d="M 300 110 L 330 110" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Step 3 -->
  <rect x="335" y="75" width="130" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="400" y="100" font-family="Hiragino Sans, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Step 3</text>
  <text x="400" y="118" font-family="Hiragino Sans, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">テキスト/画像差分</text>
  <text x="400" y="132" font-family="Hiragino Sans, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">ハイブリッド判定</text>

  <path d="M 465 110 L 495 110" stroke="#475569" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Step 4 -->
  <rect x="500" y="75" width="125" height="70" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="8"/>
  <text x="562.5" y="105" font-family="Hiragino Sans, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Step 4</text>
  <text x="562.5" y="125" font-family="Hiragino Sans, sans-serif" font-size="11" fill="#166534" text-anchor="middle">GUI即時描画</text>

  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="325" y="195" font-family="Hiragino Sans, sans-serif" font-size="12" fill="#475569" text-anchor="middle">GPUメモリマッピングにより、ステップ2〜4は完全インメモリで連携動作します</text>
</svg>

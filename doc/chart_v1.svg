<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <rect width="600" height="220" fill="#f8fafc" rx="12"/>
  <text x="300" y="32" font-family="Hiragino Sans, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">システム構成図 v1.0</text>
  
  <!-- Node 1: Client -->
  <rect x="40" y="70" width="130" height="80" fill="#3b82f6" rx="8"/>
  <text x="105" y="105" font-family="Hiragino Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Web Client</text>
  <text x="105" y="125" font-family="Hiragino Sans, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">React GUI</text>

  <!-- Arrow 1 -->
  <path d="M 170 110 L 220 110" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Node 2: API Gateway -->
  <rect x="235" y="70" width="130" height="80" fill="#10b981" rx="8"/>
  <text x="300" y="105" font-family="Hiragino Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">API Gateway</text>
  <text x="300" y="125" font-family="Hiragino Sans, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">REST / gRPC</text>

  <!-- Arrow 2 -->
  <path d="M 365 110 L 415 110" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Node 3: Database -->
  <rect x="430" y="70" width="130" height="80" fill="#f59e0b" rx="8"/>
  <text x="495" y="105" font-family="Hiragino Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">DB Server</text>
  <text x="495" y="125" font-family="Hiragino Sans, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">PostgreSQL</text>

  <!-- Marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="300" y="190" font-family="Hiragino Sans, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">処理能力: 1,000 req/sec</text>
</svg>
